<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Perseverance · Simulación marciana</title>
  <style>
    :root {
      --amber: #ffb066;
      --amber-soft: #f3d3b0;
      --ink: #1a0d07;
      --glass: rgba(26, 13, 7, 0.42);
      --line: rgba(255, 176, 102, 0.28);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #140a07; }
    body {
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--amber-soft);
      -webkit-font-smoothing: antialiased;
    }
    canvas { display: block; }
    #app { position: fixed; inset: 0; }

    #ui {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 22px 24px 20px;
    }
    header { display: flex; align-items: center; gap: 14px; }
    .mark {
      width: 42px; height: 42px; border-radius: 10px;
      border: 1px solid var(--line);
      background: linear-gradient(160deg, rgba(255,176,102,.22), rgba(255,176,102,.04));
      display: grid; place-items: center;
      box-shadow: 0 8px 26px rgba(0,0,0,.35);
    }
    .mark svg { width: 24px; height: 24px; }
    h1 {
      margin: 0; font-size: 15px; letter-spacing: .28em; font-weight: 700;
      color: #ffe6cd; text-transform: uppercase;
    }
    header p {
      margin: 3px 0 0; font-size: 11px; letter-spacing: .12em;
      text-transform: uppercase; color: rgba(243, 211, 176, .55);
    }

    .telemetry {
      position: absolute; left: 24px; bottom: 64px;
      min-width: 232px; padding: 12px 14px;
      background: var(--glass); border: 1px solid var(--line); border-radius: 12px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
    }
    .telemetry::before {
      content: "TELEMETRÍA";
      display: block; font-size: 9px; letter-spacing: .26em; font-weight: 700;
      color: rgba(255, 176, 102, .65); margin-bottom: 8px;
    }
    .row {
      display: flex; align-items: baseline; gap: 8px;
      font-variant-numeric: tabular-nums;
      padding: 4px 0; border-top: 1px solid rgba(255, 176, 102, .08);
    }
    .row:first-of-type { border-top: 0; }
    .row span { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: rgba(243, 211, 176, .52); flex: 1; }
    .row b { font-size: 14px; font-weight: 600; color: #ffe9d2; letter-spacing: .04em; }
    .row i { font-size: 9.5px; font-style: normal; color: rgba(243, 211, 176, .45); width: 22px; }

    footer#hint {
      position: absolute; right: 24px; bottom: 20px; max-width: min(560px, calc(100% - 48px));
      display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: flex-end;
      font-size: 11.5px; color: rgba(243, 211, 176, .62); letter-spacing: .02em;
      transition: opacity 1.4s ease;
    }
    footer#hint.hide { opacity: 0; }
    kbd {
      display: inline-block; min-width: 20px; text-align: center;
      padding: 2px 5px; border-radius: 5px;
      border: 1px solid rgba(255, 176, 102, .28);
      background: rgba(255, 176, 102, .08);
      color: #ffd9b3; font: 600 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    #vignette {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 46%, transparent 42%, rgba(20, 8, 4, .55) 100%);
      mix-blend-mode: multiply;
    }

    #loader {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center; gap: 18px; grid-auto-flow: row;
      background: radial-gradient(circle at 50% 40%, #2a1409, #0d0503 70%);
      transition: opacity .8s ease; pointer-events: none;
    }
    #loader.done { opacity: 0; }
    #loader p { margin: 0; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: rgba(243,211,176,.6); }
    .ring {
      width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid rgba(255,176,102,.2);
      border-top-color: var(--amber);
      animation: spin 1.1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      #ui { padding: 14px; }
      .telemetry { left: 14px; bottom: 60px; min-width: 190px; padding: 10px 11px; }
      footer#hint { right: 14px; bottom: 14px; font-size: 10.5px; }
      h1 { font-size: 13px; letter-spacing: .2em; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="ui">
    <header>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffb066" stroke-width="1.4" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M12 2.6v3.1M12 18.3v3.1M2.6 12h3.1M18.3 12h3.1" />
          <path d="M5.4 5.4l2.2 2.2M16.4 16.4l2.2 2.2M18.6 5.4l-2.2 2.2M7.6 16.4l-2.2 2.2" />
        </svg>
      </div>
      <div>
        <h1>Perseverance</h1>
        <p>Jezero Crater · Mars Yard Sim</p>
      </div>
    </header>

    <section class="telemetry" aria-live="polite">
      <div class="row"><span>Velocidad</span><b id="t-speed">0.00</b><i>m/s</i></div>
      <div class="row"><span>Rumbo</span><b id="t-head">000</b><i>°</i></div>
      <div class="row"><span>Inclinación</span><b id="t-tilt">0.0</b><i>°</i></div>
      <div class="row"><span>Odómetro</span><b id="t-odo">0.0</b><i>m</i></div>
      <div class="row"><span>Posición</span><b id="t-pos">0, 0</b></div>
    </section>

    <footer id="hint">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> conducir</span>
      <span><kbd>Shift</kbd> turbo</span>
      <span><kbd>C</kbd> cámara</span>
      <span>arrastra para orbitar · rueda para zoom</span>
    </footer>
  </div>

  <div id="vignette"></div>
  <div id="loader"><div class="ring"></div><p>Desplegando Perseverance…</p></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
