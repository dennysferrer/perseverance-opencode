ght:24px}footer#hint.hide{opacity:0}kbd{text-align:center;color:#ffd9b3;background:#ffb06614;border:1px solid #ffb06647;border-radius:5px;min-width:20px;padding:2px 5px;font:600 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;display:inline-block}#vignette{pointer-events:none;mix-blend-mode:multiply;background:radial-gradient(at 50% 46%,#0000 42%,#1408048c 100%);position:fixed;inset:0}#loader{z-index:10;pointer-events:none;background:radial-gradient(circle at 50% 40%,#2a1409,#0d0503 70%);grid-auto-flow:row;place-items:center;gap:18px;transition:opacity .8s;display:grid;position:fixed;inset:0}#loader.done{opacity:0}#loader p{letter-spacing:.28em;text-transform:uppercase;color:#f3d3b099;margin:0;font-size:11px}.ring{border:1px solid #ffb06633;border-top-color:var(--amber);border-radius:50%;width:46px;height:46px;animation:1.1s linear infinite spin}@keyframes spin{to{transform:rotate(360deg)}}@media (width<=720px){#ui{padding:14px}.telemetry{min-width:190px;padding:10px 11px;bottom:60px;left:14px}footer#hint{font-size:10.5px;bottom:14px;right:14px}h1{letter-spacing:.2em;font-size:13px}}</style>
